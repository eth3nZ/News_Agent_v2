[package]
name = "news-agent-tauri"
version = "0.1.0"
description = "News Agent Desktop - Tauri v2 + Rust + Python pipeline"
authors = ["eth3nZ"]
edition = "2021"

[lib]
name = "news_agent_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
